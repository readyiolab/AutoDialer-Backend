# Autodialer frontend SPA only — install as sites-available/autodialer
# Do NOT edit lendigomicrocare / lmendigo / lmendigo-root.
# Place Vite dist at /var/www/autodialer
# Certbot:
#   certbot --nginx -d autodialer.lendigomicrocare.com

server {
    listen 80;
    listen [::]:80;
    server_name autodialer.lendigomicrocare.com;

    root /var/www/autodialer;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
