# Autodialer API only — install as sites-available/autodialerapi
# Do NOT edit lendigomicrocare / lmendigo / lmendigo-root.
# Proxies to PM2 process autodialer-api on 127.0.0.1:3010
# If PORT is 3011 in backend .env, change the upstream below only.
# Certbot:
#   certbot --nginx -d autodialerapi.lendigomicrocare.com

upstream autodialer_api {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name autodialerapi.lendigomicrocare.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://autodialer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
